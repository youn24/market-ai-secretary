# 15分ごと市場監視（急変アラート）
name: 市場監視アラート

on:
  schedule:
    - cron: "*/15 22-23 * * 0-4"  # UTC 22-23時（JST 7-8時）平日
    - cron: "*/15 0-13 * * 1-5"   # UTC 0-13時（JST 9-22時）平日
    - cron: "*/30 14-21 * * 1-5"  # UTC 14-21時（JST 23-翌6時）夜間＝日経先物・米市場監視（30分毎）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: ライブラリインストール
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests python-dotenv \
                      PyYAML yfinance feedparser google-generativeai

      - name: 市場監視・急変アラート
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 為替シグナルはFX専用グループへ送る。未設定ならメイン側に落ちる
          TELEGRAM_FX_CHAT_ID: ${{ secrets.TELEGRAM_FX_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python monitor_run.py

      - name: シグナルの通知済み記録を保存（重複通知の防止用）
        run: |
          # これらが保存されないと「同じサインは1日1回」が毎回リセットされる。
          # 以前は alert_state.json だけを見ていたうえ、そのファイルが
          # gitignore対象だったため `git status --porcelain` が常に空を返し、
          # このブロック自体が一度も実行されていなかった（2026-08-18発覚）。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/alert_state.json data/tech_signal_state.json \
                   data/fx_signal_state.json data/divergence_state.json \
                   data/risk_gauge_state.json data/gap_state.json \
                   data/pattern_state.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore: シグナル通知済み記録の更新 [skip ci]"
            # この状態ファイルが保存されないと「同じアラートを何度も送らない」が
            # 毎回リセットされ、重複通知が発生する。握りつぶしてはいけない。
            git pull --rebase --autostash origin main || true
            git push || { echo "::error::アラート状態のpushに失敗しました（重複通知の原因になります）"; exit 1; }
          fi
