# 15分ごと市場監視（急変アラート）
name: 市場監視アラート

on:
  schedule:
    # ⚠️ 2026-08-31: 予約実行がほぼ全部落とされる状態になった。
    #    実測: 8/26は51回動いていたのが、8/30には2回、8/31も2回。
    #    朝のレポートも 8/28(金) と 8/31(月) が実行されず、
    #    8/27は293分遅れだった。
    #
    #    このリポジトリの予約は1日61回で、その**57回がこのファイル**だった。
    #    公開リポジトリはActions分こそ無制限だが、予約実行を多く積む
    #    リポジトリはGitHub側で遅延・間引きの対象になる。
    #    monitor が枠を食い尽くし、**朝のレポートまで落とされていた**。
    #
    #    そこで「本当に15分刻みが要る時間帯」だけに絞る。
    #    ・東京の寄り付き前後（JST 8:45-9:30）… 窓開けと急変を拾う
    #    ・米国の寄り付き（JST 22:30-23:30）… 夜間の急変の起点
    #    それ以外は30分・1時間に落とす。急変アラートの基準は
    #    「年5〜15回」に較正してあり、15分と30分で取りこぼしは実質変わらない。
    #    1日57回 → 約20回。
    # ⚠️ 2026-11-19 再削減（38回/日 → 15回/日）
    #
    #    実測した遅れ（完了時刻・予定との差）:
    #      朝レポート（予定6:23）      → 10:21〜13:14
    #      週次の重み較正（予定7:45）  → 9:32〜11:23、しかも**週を追うごとに悪化**
    #        10/19 9:32 → 10/26 9:43 → 11/02 10:51 → 11/09 11:00 → 11/16 11:23
    #
    #    遅れは朝だけでなく**全部のワークフローに出ている**ので、
    #    時刻のずらし方ではなく「このリポジトリ全体の予約の多さ」が原因と見る。
    #    予約47回/日のうち**38回がこのファイル**だった（81%）。
    #    2026-08-31 に 57→38 と減らしたときは監視自体は復活したが、
    #    朝の遅れは解消しなかった。今回はさらに半分以下にする。
    #
    #    ⚠️ 代わりに失うもの: 急変に気づくまでの時間が最大2時間に延びる。
    #    発報の実績（10/1以降126件）は1日中まんべんなく出ているため、
    #    時間帯を削るのではなく**どの時間帯も粗くする**方式にした。
    #    ただし値が飛びやすい2つの窓だけは30分刻みを残す:
    #      ・JST 7:00-8:45（米国の引け後〜東京の寄り付き前。発報が最も多い時間帯）
    #      ・JST 9:00（東京の寄り付き）
    - cron: "*/30 22-23 * * 0-4"   # UTC 22-23時（JST 7-8時台）= 寄り付き前。30分毎
    - cron: "0 0 * * 1-5"          # UTC 0時（JST 9時）= 東京の寄り付き
    - cron: "0 2,4,6 * * 1-5"      # UTC 2/4/6時（JST 11/13/15時）= 東京場中は2時間毎
    - cron: "0 8,10,12 * * 1-5"    # UTC 8/10/12時（JST 17/19/21時）= 米国の寄り付き前
    - cron: "0 14,16,18,20 * * 1-5" # UTC 14/16/18/20時（JST 23/1/3/5時）= 夜間は2時間毎
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: ライブラリインストール
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests python-dotenv \
                      PyYAML yfinance feedparser google-generativeai

      - name: 市場監視・急変アラート
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 為替シグナルはFX専用グループへ送る。未設定ならメイン側に落ちる
          TELEGRAM_FX_CHAT_ID: ${{ secrets.TELEGRAM_FX_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python monitor_run.py

      - name: シグナルの通知済み記録を保存（重複通知の防止用）
        run: |
          # これらが保存されないと「同じサインは1日1回」が毎回リセットされる。
          # 以前は alert_state.json だけを見ていたうえ、そのファイルが
          # gitignore対象だったため `git status --porcelain` が常に空を返し、
          # このブロック自体が一度も実行されていなかった（2026-08-18発覚）。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/alert_state.json data/tech_signal_state.json \
                   data/fx_signal_state.json data/divergence_state.json \
                   data/risk_gauge_state.json data/gap_state.json \
                   data/pattern_state.json data/us_movers_state.json \
                   data/nikkei_impact_state.json data/fear_watch_state.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore: シグナル通知済み記録の更新 [skip ci]"
            # この状態ファイルが保存されないと「同じアラートを何度も送らない」が
            # 毎回リセットされ、重複通知が発生する。握りつぶしてはいけない。
            git pull --rebase --autostash origin main || true
            git push || { echo "::error::アラート状態のpushに失敗しました（重複通知の原因になります）"; exit 1; }
          fi
