# GitHub Actions - 毎日自動実行（PC電源OFF中も動く）
# 朝7:30 JST（UTCの前日22:30）に自動実行

name: 毎日市場レポート

on:
  schedule:
    - cron: "30 22 * * 1-5"   # UTC 22:30 = JST 7:30（平日）
  workflow_dispatch:  # 手動実行ボタンも有効化

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 日本語フォントインストール
        run: |
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: ライブラリインストール
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests feedparser beautifulsoup4 \
                      lxml python-dotenv PyYAML yfinance plotly \
                      matplotlib kaleido google-generativeai

      - name: 市場データ取得・レポート生成・Telegram通知
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAGES_URL: "https://youn24.github.io/market-ai-secretary"
        run: |
          python cloud_run.py --mode morning

      - name: 予測学習データをmainブランチに保存（永続化）
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Bot"
          # data/predictions.json があればコミットして永続化
          if [ -f data/predictions.json ]; then
            git add data/predictions.json
            git diff --staged --quiet || git commit -m "🧠 予測学習データ更新 $(date '+%Y-%m-%d')"
            git push origin main || true
          fi

      - name: レポートをgh-pagesに公開
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # gh-pagesブランチにreportsフォルダを公開
          cp -r reports/ /tmp/reports_backup
          git fetch origin gh-pages 2>/dev/null || true
          git checkout --orphan gh-pages-temp
          git rm -rf . --quiet 2>/dev/null || true
          cp -r /tmp/reports_backup/* .
          # インデックスページ作成
          ls *.html 2>/dev/null | sort -r | head -1 | xargs -I{} cp {} index.html 2>/dev/null || true
          git add -A
          git commit -m "レポート更新 $(date '+%Y-%m-%d %H:%M JST')" || true
          git push origin gh-pages-temp:gh-pages --force
          git checkout main

      - name: レポートをArtifactとして保存（7日間）
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_number }}
          path: reports/
          retention-days: 7
