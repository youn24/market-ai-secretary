# GitHub Actions - 平日4回の定期アラート
# JST  6:00 東京市場オープン前
# JST  9:00 東証オープン時
# JST 15:30 東証クローズ後
# JST 23:00 NY市場チェック

name: 日中定期アラート（6時・9時・15:30・23時）

on:
  schedule:
    - cron: "0 21 * * 0-4"   # UTC日〜木 21:00 = JST月〜金  6:00（東京市場オープン前）
    - cron: "0 0 * * 1-5"    # UTC月〜金 00:00 = JST月〜金  9:00（東証オープン時）
    - cron: "30 6 * * 1-5"   # UTC月〜金 06:30 = JST月〜金 15:30（東証クローズ後）
    - cron: "0 14 * * 1-5"   # UTC月〜金 14:00 = JST月〜金 23:00（NY市場チェック）
  workflow_dispatch:           # 手動実行ボタン

permissions:
  contents: write

jobs:
  intraday-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 日本語フォントインストール
        run: |
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: ライブラリインストール
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests feedparser beautifulsoup4 \
                      lxml python-dotenv PyYAML yfinance plotly \
                      matplotlib kaleido google-generativeai

      - name: 市場分析・Telegram通知
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAGES_URL: "https://youn24.github.io/market-ai-secretary"
        run: |
          python cloud_run.py --mode morning

      - name: 予測学習データを保存
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Bot"
          if [ -f data/predictions.json ]; then
            git add data/predictions.json
            git diff --staged --quiet || git commit -m "🧠 予測学習データ更新 $(date '+%Y-%m-%d %H:%M')"
            git push origin main || true
          fi
