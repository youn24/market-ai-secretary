# GitHub Actions - 平日の軽量チェック（前場まとめ・引け後）
# JST 12:00 前場（午前の取引）終了後 → サマリーカード1枚＋前場の分析要約
# JST 15:30 東証クローズ後（引け後）  → サマリーカード1枚＋一言
#
# ※ 6:00 は 7:30 のフル朝レポートと重複するため廃止
# ※ 23:00 は evening_recap.yml（夜の振り返り3通）に集約したため廃止

name: 日中軽量チェック（前場12時・引け後15:30）

on:
  schedule:
    - cron: "0 3 * * 1-5"    # UTC月〜金 03:00 = JST月〜金 12:00（前場終了後・前場まとめ）
    - cron: "30 6 * * 1-5"   # UTC月〜金 06:30 = JST月〜金 15:30（東証クローズ後・引け後）
  workflow_dispatch:           # 手動実行ボタン

permissions:
  contents: write

jobs:
  intraday-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 日本語フォントインストール
        run: |
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: ライブラリインストール
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests feedparser beautifulsoup4 \
                      lxml python-dotenv PyYAML yfinance plotly \
                      matplotlib kaleido google-generativeai

      - name: 軽量チェック・Telegram通知（カード1枚＋一言）
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAGES_URL: "https://youn24.github.io/market-ai-secretary"
        run: |
          python intraday_run.py

      - name: 予測学習データを保存
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Bot"
          if [ -f data/predictions.json ]; then
            git add data/predictions.json
            git diff --staged --quiet || git commit -m "🧠 予測学習データ更新 $(date '+%Y-%m-%d %H:%M')"
            git push origin main || true
          fi
