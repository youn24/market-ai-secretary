name: "💹 FX午後レポート（毎日 14:00 JST）"

on:
  schedule:
    # UTC 05:00 = JST 14:00 (毎日、FX は土日も稼働)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "デバッグモード（extra logging）"
        required: false
        default: "false"

jobs:
  fx-noon-report:
    name: "FX午後ダッシュボード生成 & Telegram配信"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. チェックアウト ──────────────────────────────────────
      - name: "📥 リポジトリをチェックアウト"
        uses: actions/checkout@v4

      # ── 2. Python セットアップ ────────────────────────────────
      - name: "🐍 Python 3.11 セットアップ"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. 日本語フォントインストール ────────────────────────
      - name: "🇯🇵 日本語フォントインストール"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -fv
          echo "✅ 日本語フォントインストール完了"

      # ── 4. Pythonライブラリインストール ───────────────────────
      - name: "📦 依存ライブラリインストール"
        run: |
          pip install --upgrade pip --quiet
          pip install \
            yfinance \
            matplotlib \
            japanize-matplotlib \
            requests \
            python-dotenv \
            pandas \
            numpy \
            PyYAML \
            --quiet
          echo "✅ ライブラリインストール完了"

      # ── 5. データ出力ディレクトリ準備 ────────────────────────
      - name: "📁 出力ディレクトリ準備"
        run: |
          mkdir -p data/fx_charts
          mkdir -p logs
          echo "✅ ディレクトリ準備完了"

      # ── 6. FX午後レポート実行 ─────────────────────────────────
      - name: "💹 FX午後レポート実行"
        env:
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_FX_CHAT_ID:   ${{ secrets.TELEGRAM_FX_CHAT_ID }}
          TELEGRAM_FX_BOT_TOKEN: ${{ secrets.TELEGRAM_FX_BOT_TOKEN }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAGES_URL:      "https://youn24.github.io/market-ai-secretary"
          PYTHONIOENCODING:      "utf-8"
          PYTHONUTF8:            "1"
        run: |
          echo "🕑 実行開始: $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M:%S JST')"
          python fx_noon_run.py
          echo "✅ FX午後レポート完了"

      # ── 7. 生成チャートをアーティファクトとして保存 ──────────
      - name: "💾 チャートをアーティファクト保存（7日間）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "fx-chart-${{ github.run_number }}"
          path: "data/fx_charts/*.png"
          retention-days: 7
          if-no-files-found: warn
