name: 週次シグナル重み較正

# 以前はここで週次パフォーマンス報告（src.weekly_performance）も送っていたが、
# 2026-08-25 のコミット 5445fb1 で src/weekly_performance.py を
# 「どこからも呼ばれていない重複モジュール」として削除した際、
# このワークフローの参照を消し忘れ、以降 ModuleNotFoundError で
# 毎週赤くなっていた（2026-08-31 発覚）。
# 週次のパフォーマンス／正解率レポートは weekly_report.yml（weekly_run.py）が
# 日曜 8:00 JST に配信しており重複のため、報告ステップは復活させず削除した。
# このワークフローの役割はシグナル重みの再較正のみ。

on:
  schedule:
    - cron: "45 22 * * 0"  # UTC日曜22:45 = JST月曜7:45
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests python-dotenv PyYAML

      - name: シグナル重みを実績で再較正してコミット
        run: |
          # 「どの指標が実際に翌日の日経を当てたか」で重みを更新
          # 較正が落ちたまま気づかないと、重みが古いまま固定される。
          python -m src.calibrate_weights || echo "::error::重みの再較正に失敗しました（重みは更新されていません）"
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Bot"
          git add config/signal_weights.json
          if git diff --staged --quiet; then
            echo "重みに変更はありません"
          else
            git commit -m "🎯 シグナル重み再較正 $(date '+%Y-%m-%d')"
            # `|| true` だと較正結果が毎回消え、重みが永久に更新されない
            if ! git push origin main; then
              git pull --rebase --autostash origin main || true
              git push origin main || { echo "::error::重みのpushに失敗しました"; exit 1; }
            fi
          fi
