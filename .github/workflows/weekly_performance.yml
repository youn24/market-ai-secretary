name: 週次AIパフォーマンス報告

on:
  schedule:
    - cron: "45 22 * * 0"  # UTC日曜22:45 = JST月曜7:45
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests python-dotenv PyYAML yfinance google-generativeai

      - name: シグナル重みを実績で再較正してコミット
        run: |
          # 「どの指標が実際に翌日の日経を当てたか」で重みを更新
          # 失敗しても後続の報告送信は続けたいが、無音にはしない。
          # 較正が落ちたまま気づかないと、重みが古いまま固定される。
          python -m src.calibrate_weights || echo "::error::重みの再較正に失敗しました（重みは更新されていません）"
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Bot"
          git add config/signal_weights.json
          if git diff --staged --quiet; then
            echo "重みに変更はありません"
          else
            git commit -m "🎯 シグナル重み再較正 $(date '+%Y-%m-%d')"
            # `|| true` だと較正結果が毎回消え、重みが永久に更新されない
            if ! git push origin main; then
              git pull --rebase --autostash origin main || true
              git push origin main || { echo "::error::重みのpushに失敗しました"; exit 1; }
            fi
          fi

      - name: 週次パフォーマンス報告送信
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -c "from src.weekly_performance import generate_weekly_report, send_weekly_telegram; r = generate_weekly_report(); send_weekly_telegram(r.get('telegram_message', ''))"
