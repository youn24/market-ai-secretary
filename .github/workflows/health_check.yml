name: 点検（公開物とワークフローの健全性）

on:
  schedule:
    # UTC 00:30 = JST 9:30。
    # 当初は8:30にしていたが、2026-08-19に誤検知した。
    # レポート本体の実行はcronから15分ほど遅れて始まり、生成に約20分、
    # そこからGitHub Pagesの再ビルドにさらに数分かかる。8:30では間に合わない。
    # 誤報が続くと点検そのものが信用されなくなるため、余裕をもって2時間後にする。
    - cron: "30 0 * * 1-5"
  workflow_dispatch:
  push:
    # ワークフローを書き換えたときは、その場で検査する。
    # 事故はいつも「変更した直後」に仕込まれ、気づくのは数日後だったため。
    paths:
      - ".github/workflows/**"
      - "scripts/lint_workflows.py"

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ワークフローの静かに壊れる書き方を検査
        run: python -m scripts.lint_workflows

      - name: 公開ページが実際に更新されているか外から確認
        # 定期実行のときだけ。ワークフロー編集のpushでは公開状況は変わらないため。
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_PAGES_URL: ${{ secrets.GITHUB_PAGES_URL }}
        run: |
          # ⚠️ python-dotenv も要る。notify_telegram が読み込むため、
          #    requests だけだと異常を検知しても「通知モジュールを
          #    読み込めませんでした」で黙る（2026-08-27に実際に起きた）。
          #    点検が鳴らないのは、点検が無いのと同じ。
          pip install requests python-dotenv --quiet
          # 異常なら publish_check が exit 1 で落ち、Telegramにも通知が飛ぶ。
          # ここを `|| true` にすると点検そのものが無意味になるので絶対に付けない。
          python -m src.publish_check
