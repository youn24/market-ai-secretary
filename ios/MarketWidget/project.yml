# XcodeGen 設定。Macで `brew install xcodegen && xcodegen` → MarketWidget.xcodeproj が生成される
name: MarketWidget
options:
  bundleIdPrefix: com.youn24     # ⚠️ 変えたら Shared/Models.swift の groupID と下の App Group も合わせる
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # ← Xcodeの Signing & Capabilities でチームを選ぶか、ここに Team ID を書く
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MarketWidget:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: MarketWidgetExtension
    entitlements:
      path: App/MarketWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.youn24.marketwidget]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 市場ウォッチ
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  MarketWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/MarketWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.youn24.marketwidget]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 市場ウォッチ
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
