  - keyword: "倒産 破綻 経営危機"
    label: "⚠️ 倒産情報"
    importance: "B"
    category: "国内経済"

# ─── 設定 ────────────────────────────────────────────────────
google_news_rss_base: "https://news.google.com/rss/search?q={keyword}&hl=ja&gl=JP&ceid=JP:ja"
max_items_per_keyword: 3
keep_days: 30
