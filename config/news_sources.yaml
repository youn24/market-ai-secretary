  - keyword: "中国 経済 景気 不動産 不況"
    label: "🇨🇳 中国経済"
    importance: "B"
    category: "海外経済"

  - keyword: "欧州 ECB ユーロ圏 景気"
    label: "🇪🇺 欧州経済"
    importance: "B"
