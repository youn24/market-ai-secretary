    importance: "B"
    category: "企業"

  - keyword: "エヌビディア NVIDIA 半導体 AI"
    label: "💻 AI・半導体"
    importance: "B"
    category: "企業"

  # ── コモディティ ──────────────────────────────────────────
  - keyword: "原油 WTI 価格 OPEC"
    label: "🛢 原油"
