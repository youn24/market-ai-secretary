  - keyword: "中国 台湾 米中関係 対立"
    label: "⚠️ 米中・台湾"
    importance: "A"
    category: "地政学"

  # ── 米国政治・経済政策 ────────────────────────────────────
  - keyword: "トランプ 関税 貿易 経済政策"
    label: "🇺🇸 米経済政策"
