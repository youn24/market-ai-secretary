  - keyword: "米国株 ニューヨーク ダウ S&P"
    label: "📈 米国株"
    importance: "A"
    category: "株式市場"

  - keyword: "ナスダック テック株 AI株"
    label: "📈 テック株"
    importance: "B"
    category: "株式市場"

  # ── 為替・債券 ────────────────────────────────────────────
  - keyword: "ドル円 為替 円安 円高"
    label: "💱 為替"
