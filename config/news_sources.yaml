# ニュース収集キーワード設定
# カテゴリ別にバランスよく配置

google_news_keywords:

  # ── 中央銀行・金融政策（超重要） ──────────────────────────
  - keyword: "日銀 政策金利 利上げ"
    label: "🏦 日銀"
    importance: "A"
    category: "金融政策"

  - keyword: "FRB 利上げ 利下げ 政策金利"
    label: "🏦 FRB"
    importance: "A"
    category: "金融政策"

  # ── 経済指標（超重要） ────────────────────────────────────
  - keyword: "米国 CPI インフレ 消費者物価"
    label: "📊 米CPI"
    importance: "A"
    category: "経済指標"

  - keyword: "雇用統計 非農業部門 失業率"
    label: "📊 雇用統計"
    importance: "A"
    category: "経済指標"

  - keyword: "GDP 経済成長率 景気"
    label: "📊 GDP"
    importance: "A"
    category: "経済指標"

  - keyword: "PMI 製造業 景気指数"
    label: "📊 PMI"
    importance: "B"
    category: "経済指標"

  # ── 株式市場 ──────────────────────────────────────────────
  - keyword: "日経平均 株価 急落 急騰"
    label: "📈 日本株"
