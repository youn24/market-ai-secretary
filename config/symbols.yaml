# 恐怖指数・センチメント指標
fear_indices:
  - symbol: "^VIX"
    name: "VIX（恐怖指数）"
    category: "fear"
    description: "S&P500の30日先のボラティリティ予測。20超で警戒、30超で恐怖"
  - symbol: "NIKKEI_VI"
    name: "日経VI（日本版恐怖指数）"
    category: "fear"
    description: "日経平均の30日先ボラティリティ予測。20超で警戒、30超で恐怖。日経公式データ"
  - symbol: "^VIX9D"
    name: "VIX9D（超短期）"
    category: "fear"
    description: "9日先のVIX。直近のパニック度を示す"
  - symbol: "^VIX3M"
    name: "VIX3M（3ヶ月）"
    category: "fear"
    description: "3ヶ月先のVIX。中期的な不安感を示す"
  - symbol: "^VVIX"
    name: "VVIX（VIXのVIX）"
    category: "fear"
    description: "VIX自体の変動率。市場の不確実性の不確実性"
  - symbol: "^SKEW"
    name: "SKEW（テールリスク）"
    category: "fear"
    description: "100超で暴落リスクへの警戒感。150超は極度の警戒"
  - symbol: "^TNX"
    name: "米10年金利"
    category: "fear"
    description: "安全資産への逃避時は低下する"

